name = "huw-cool"
main = "worker.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_als"]
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"

[build]
command = "pnpm build"

[[routes]]
pattern = "huw.cool"
custom_domain = true

[[routes]]
pattern = "www.huw.cool"
custom_domain = true
